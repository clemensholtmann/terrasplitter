<html lang="de">
<head>

<title>Terra Rechnungs-Splitter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #6b6b67; --text3: #9b9b97;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --success-bg: #eaf3de; --success: #3b6d11;
    --warning-bg: #faeeda; --warning: #854f0b;
    --danger-bg: #fcebeb; --danger: #a32d2d;
    --info-bg: #e6f1fb; --info: #185fa5;

    :root {
      --bg: #1e1e1c; --bg2: #282824; --bg3: #323230;
      --text: #f0efe9; --text2: #a0a09a; --text3: #606060;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);

      --warning-bg: #412402; --warning: #ef9f27;
      --danger-bg: #501313; --danger: #f09595;

  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg3); min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
  #app { width: 100%; max-width: 680px; }
  h2 { font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  p { font-size: 14px; color: var(--text2); line-height: 1.5; }
  button, input, select { font-family: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; outline: none; transition: background 0.12s; }
  button { padding: 6px 14px; }
  button:hover { background: var(--bg2); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type="number"], select { height: 32px; padding: 0 8px; }
  input[type="text"], input[type="password"] { height: 32px; padding: 0 8px; width: 100%; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; display: inline-block; }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-danger  { background: var(--danger-bg);  color: var(--danger); }
  .badge-info    { background: var(--info-bg);    color: var(--info); }
  .btn-primary { width: 100%; padding: 10px; font-size: 14px; font-weight: 500; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-weight: 400; color: var(--text3); font-size: 11px; padding-bottom: 4px; }
  td { padding: 3px 0; color: var(--text); }

<body>
<div id="app"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const CC = [
  {id:"1001",name:"Bäckerei"},{id:"1002",name:"Konditorei"},
  {id:"1003",name:"Produktion Schöneberg"},{id:"1004",name:"FoH - NK"},
  {id:"1005",name:"FoH - SCH"},{id:"1009",name:"Pfand"},
];
const ADDR_CC = { euref:["1001","1002","1003","1005"], hermannstr:["1001","1002","1004"] };
const SKEY = "terra-splits-v4";
const GIST_SKEY = "terra-gist-config";
const KS_MIRROR = { "1004":"1005", "1005":"1004" };

let S = { step:"upload", invoice:null, rowSplits:{}, savedSplits:{}, loading:false, error:null, bookmarklet:null, copied:false, gistSaving:false, gistError:null };
function set(p){ S={...S,...p}; render(); }

// ── localStorage helpers ──────────────────────────────────────────────────────
function loadSaved(){ try{ const r=localStorage.getItem(SKEY); return r?JSON.parse(r):{}; }catch{ return {}; } }
function doSave(s){ try{ localStorage.setItem(SKEY,JSON.stringify(s)); }catch{} }
function loadGistConfig(){ try{ const r=localStorage.getItem(GIST_SKEY); return r?JSON.parse(r):{}; }catch{ return {}; } }
function saveGistConfig(cfg){ try{ localStorage.setItem(GIST_SKEY,JSON.stringify(cfg)); }catch{} }

// ── Gist API ──────────────────────────────────────────────────────────────────
async function gistWrite(pos){
  const cfg = loadGistConfig();
  if(!cfg.token) throw new Error("Kein GitHub Token hinterlegt.");
  const body = JSON.stringify({pos});
  const headers = { "Authorization":"token "+cfg.token, "Content-Type":"application/json" };

  if(cfg.gistId){
    // Update existing gist
    const res = await fetch("https://api.github.com/gists/"+cfg.gistId, {
      method:"PATCH", headers,
      body: JSON.stringify({ files:{ "candis-positionen.json":{ content:body } } })
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||"Gist-Update fehlgeschlagen"); }
    return cfg.gistId;
  } else {
    // Create new secret gist
    const res = await fetch("https://api.github.com/gists", {
      method:"POST", headers,
      body: JSON.stringify({
        description:"Terra Rechnungs-Splitter – Candis Positionen",
        public: false,
        files:{ "candis-positionen.json":{ content:body } }
      })
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||"Gist-Erstellung fehlgeschlagen"); }
    const data = await res.json();
    saveGistConfig({...cfg, gistId:data.id});
    return data.id;
  }
}

function makeRawUrl(gistId){
  // Raw URL without revision hash – always returns latest content
  return "https://gist.githubusercontent.com/raw/"+gistId+"/candis-positionen.json";
}

// ── Bookmarklet ───────────────────────────────────────────────────────────────
function makeBM(rawUrl){
  const code = `(function(){
  var RAWURL="${rawUrl}";
  var existing=document.getElementById("terra-bm-panel");
  if(existing){existing.remove();return;}
  var panel=document.createElement("div");
  panel.id="terra-bm-panel";
  panel.style.cssText="position:fixed;top:33vh;right:30%;z-index:999999;background:#fff;border:1px solid #ccc;border-radius:10px;padding:14px 16px;font-family:system-ui,sans-serif;font-size:13px;color:#1a1a18;box-shadow:0 8px 32px rgba(0,0,0,0.18);min-width:280px;max-width:340px";
  panel.innerHTML="<div id='terra-bm-handle' style='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:grab;user-select:none'><strong style='font-size:14px'>Candis Positionen</strong><button id='terra-bm-close' style='border:none;background:none;cursor:pointer;font-size:18px;color:#888;padding:0;line-height:1'>\xd7</button></div><div id='terra-bm-body' style='font-size:13px;color:#6b6b67'>Lade...</div>";
  document.body.appendChild(panel);
  document.getElementById("terra-bm-close").addEventListener("click",function(){panel.remove();});
  var handle=document.getElementById("terra-bm-handle");
  var ox=0,oy=0,sx=0,sy=0;
  handle.addEventListener("mousedown",function(e){
    if(e.target.tagName==="BUTTON") return;
    e.preventDefault();
    var r=panel.getBoundingClientRect();
    sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
    handle.style.cursor="grabbing";
    function mv(e){panel.style.left=(ox+(e.clientX-sx))+"px";panel.style.top=(oy+(e.clientY-sy))+"px";panel.style.right="auto";}
    function up(){handle.style.cursor="grab";document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);}
    document.addEventListener("mousemove",mv);
    document.addEventListener("mouseup",up);
  });
  fetch(RAWURL+"?t="+Date.now())
    .then(function(r){return r.json();})
    .then(function(data){
      var pos=data.pos||[];
      var html="";
      pos.forEach(function(p){
        var neg=p.neg?"color:#a32d2d":"color:#1a1a18";
        var label=p.neg?" RK":"";
        var val=p.netto.toFixed(2).replace(".",",");
        html+="<div style='display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #f0efe9'>"
          +"<span style='flex:1;min-width:0'><span style='font-weight:500'>"+p.ksId+"</span> <span style='color:#6b6b67;font-size:12px'>"+p.ksName+"</span><br><span style='font-size:11px;color:#9b9b97'>"+p.tax+"% MwSt.</span></span>"
          +"<span style='font-weight:500;white-space:nowrap;"+neg+"'>"+val+" \u20ac"+label+"</span>"
          +"<button class='terra-cp' data-val='"+val+"' style='padding:3px 10px;border:1px solid #ccc;border-radius:6px;background:#f7f7f5;cursor:pointer;font-size:12px;white-space:nowrap;font-family:inherit'>Kopieren</button>"
          +"</div>";
      });
      html+="<div style='margin-top:10px;font-size:11px;color:#9b9b97;text-align:center'>Netto \u00b7 zum Einf\u00fcgen in Candis</div>";
      document.getElementById("terra-bm-body").innerHTML=html;
      panel.querySelectorAll(".terra-cp").forEach(function(btn){
        btn.addEventListener("click",function(){
          navigator.clipboard.writeText(btn.dataset.val).then(function(){
            var o=btn.textContent;btn.textContent="\u2713";
            btn.style.cssText+=";background:#eaf3de;border-color:#3b6d11;color:#3b6d11";
            setTimeout(function(){btn.textContent=o;btn.style.background="";btn.style.borderColor="";btn.style.color="";},1500);
          });
        });
      });
    })
    .catch(function(e){document.getElementById("terra-bm-body").textContent="Fehler: "+e.message;});
})();`;
  return "javascript:"+encodeURIComponent(code);
}

function isExp(ts){ return !ts||(Date.now()-new Date(ts))/864e5/7>10; }

function getSaved(saved,artNr,addr){
  const e=saved[artNr]; if(!e) return null;
  const exact=e[addr];
  if(exact&&!isExp(exact.ts)) return {...exact,fromFallback:false};
  const other=addr==="euref"?"hermannstr":"euref";
  const fb=e[other];
  if(fb&&!isExp(fb.ts)) return {...fb,fromFallback:true};
  if(exact) return {...exact,fromFallback:false,expired:true};
  if(fb) return {...fb,fromFallback:true,expired:true};
  return null;
}

async function parsePDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const allWords=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    for(const item of content.items){
      if(!item.str.trim()) continue;
      allWords.push({page:p,x:Math.round(item.transform[4]),y:Math.round(item.transform[5]),text:item.str.trim()});
    }
  }
  const fullText=allWords.map(w=>w.text).join(" ");
  let addr=null;
  if(/euref/i.test(fullText)) addr="euref";
  else if(/hermannstr/i.test(fullText)) addr="hermannstr";

  const taxNetto={"7":0,"19":0,"P7":0,"P19":0};
  const taxBrutto={"7":0,"19":0,"P7":0,"P19":0};
  const byPY={};
  for(const w of allWords){ const k=`${w.page}_${w.y}`; if(!byPY[k]) byPY[k]=[]; byPY[k].push(w); }
  for(const k of Object.keys(byPY)){
    const row=byPY[k].sort((a,b)=>a.x-b.x);
    const t=row.map(w=>w.text);
    if(/^(P?(?:7|19))$/.test(t[0])&&t.length>=7){
      const key=t[0],pn=s=>parseFloat(s.replace(/\./g,"").replace(",","."))||0;
      taxNetto[key]=pn(t[2]); taxBrutto[key]=pn(t[6]);
    }
  }

  const taxCol={};
  for(const w of allWords)
    if(w.x>=500&&(w.text==="7"||w.text==="19")) taxCol[`${w.page}_${w.y}`]=w.text;

  const items=[];
  const PFAND=/^99[89]\d/;
  const USTOP=/^(BYO|MOR|BAS|AND|SOJ|AHR|wvg|BTR|RHO|OTM|SÖB|NAN|MIV|ÖMA|SBG|II|A)$/;
  for(const k of Object.keys(byPY)){
    const row=byPY[k].sort((a,b)=>a.x-b.x);
    if(!/^([A-Z]{1,3}-)?\d{6,}$/.test(row[0].text)) continue;
    const artNr=row[0].text;
    if(PFAND.test(artNr)) continue;
    const{page,y}=row[0];
    let taxCode=null;
    for(let dy=0;dy<=8;dy++){
      const t=taxCol[`${page}_${y-dy}`]||taxCol[`${page}_${y+dy}`];
      if(t){taxCode=t;break;}
    }
    if(!taxCode) continue;
    const nums=[...row.map(w=>w.text).join(" ").matchAll(/\b(\d+[,.]\d{2})\b/g)].map(m=>parseFloat(m[1].replace(",",".")));
    if(nums.length<2) continue;
    const netto=nums[nums.length-1];
    if(netto<=0) continue;
    const brutto=Math.round(netto*(1+parseInt(taxCode)/100)*100)/100;
    const nameW=[];
    let ph=0;
    for(let i=1;i<row.length;i++){
      const t=row[i].text;
      if(ph===0){if((/^[A-Z]{1,3}%?$/.test(t)&&t.length<=3)||/^\d{1,3}$/.test(t)) continue; ph=1;}
      if(ph===1){if(/^\d+[,.]\d+$/.test(t)||USTOP.test(t)) break; nameW.push(t);}
    }
    const name=nameW.join(" ").trim();
    if(!name) continue;
    // Gleiche Art.-Nr. mit gleichem Steuersatz (z.B. Nachlieferung / Ersatz fuer
    // eine ausgelistete Position) zusammenfuehren statt verwerfen.
    const dup=items.find(it=>it.artNr===artNr&&it.tax===taxCode);
    if(dup){
      dup.priceNetto=Math.round((dup.priceNetto+netto)*100)/100;
      dup.price=Math.round(dup.priceNetto*(1+parseInt(dup.tax)/100)*100)/100;
      continue;
    }
    items.push({artNr,name,price:brutto,priceNetto:netto,tax:taxCode});
  }
  return{items,taxNetto,taxBrutto,addr};
}

function getAvail(addr){ const ids=addr?ADDR_CC[addr]:["1001","1002","1003","1004","1005"]; return CC.filter(c=>ids.includes(c.id)); }
function defaultKS(item,addr){
  const avail=getAvail(addr);
  if(item.tax==="19"){const f=avail.find(c=>c.id==="1005")||avail.find(c=>c.id==="1004"); if(f) return f.id;}
  return avail[0]?.id||"1001";
}
function filterSplits(splits,addr){
  const ids=getAvail(addr).map(c=>c.id);
  return splits.map(sp=>{
    if(ids.includes(sp.ks)) return sp;
    const mirror=KS_MIRROR[sp.ks];
    if(mirror&&ids.includes(mirror)) return {...sp,ks:mirror};
    return {...sp,ks:ids[0]};
  });
}

function calcPos(){
  const{invoice,rowSplits}=S; if(!invoice) return[];
  const t={};
  for(const item of invoice.items)
    for(const sp of(rowSplits[item.artNr]||[])){
      const k=`${sp.ks}_${item.tax}`;
      if(!t[k]) t[k]={netto:0,taxRate:parseInt(item.tax)||0};
      t[k].netto+=(sp.pct/100)*item.priceNetto;
    }
  const{P7,P19}=invoice.taxBrutto;
  const{P7:PN7,P19:PN19}=invoice.taxNetto;
  if(P19){ if(!t["1009_P19"]) t["1009_P19"]={netto:0,taxRate:19}; t["1009_P19"].netto+=(PN19||0); }
  if(P7){ if(!t["1009_P7"]) t["1009_P7"]={netto:0,taxRate:7}; t["1009_P7"].netto+=(PN7||0); }
  return Object.entries(t).filter(([,v])=>Math.abs(v.netto)>0.001).map(([k,v])=>{
    const[ksId,tax]=k.split("_"),ks=CC.find(c=>c.id===ksId);
    const netto=Math.round(v.netto*100)/100;
    const brutto=Math.round(netto*(1+v.taxRate/100)*100)/100;
    return{ksId,ksName:ks?.name||ksId,tax,amount:brutto,netto,neg:netto<0};
  }).sort((a,b)=>{
    const rank=p=>p.tax==="19"?0:p.tax==="P19"?1:p.tax==="P7"?2:p.tax==="7"?3:4;
    const ra=rank(a),rb=rank(b);
    if(ra!==rb) return ra-rb;
    return a.ksId.localeCompare(b.ksId);
  });
}

async function handleFile(file){
  if(!file||!file.name.endsWith(".pdf")){set({error:"Nur PDF-Dateien."}); return;}
  set({loading:true,error:null});
  try{
    const invoice=await parsePDF(file);
    if(!invoice.items.length){set({loading:false,error:"Keine Artikel gefunden. Terra-Rechnung?"}); return;}
    const rowSplits={};
    for(const item of invoice.items){
      const saved=getSaved(S.savedSplits,item.artNr,invoice.addr);
      rowSplits[item.artNr]=saved?filterSplits(saved.splits,invoice.addr):[{ks:defaultKS(item,invoice.addr),pct:100}];
    }
    set({invoice,rowSplits,step:"review",loading:false});
  }catch(e){set({loading:false,error:"Fehler: "+e.message});}
}

function eur(v){return v.toFixed(2).replace(".",",")+"\u00a0€";}

function splitAmount(sp,item){
  const n=Math.round((sp.pct/100)*item.priceNetto*100)/100;
  const b=Math.round(n*(1+parseInt(item.tax)/100)*100)/100;
  return{n,b};
}

function updateSplitField(art,i,field,val){
  const sps=[...(S.rowSplits[art]||[])];
  sps[i]={...sps[i],[field]:field==="pct"?parseFloat(val)||0:val};
  S={...S,rowSplits:{...S.rowSplits,[art]:sps}};
  updateSummary();
}

function updateSummary(){
  const pos=calcPos(),posTotal=pos.reduce((s,p)=>s+p.amount,0);
  const brutto=Object.values(S.invoice.taxBrutto).reduce((s,v)=>s+v,0);
  const balanced=Math.abs(posTotal-brutto)<0.05;
  const allOk=S.invoice.items.every(it=>{const sps=S.rowSplits[it.artNr]||[];return sps.length>0&&Math.abs(sps.reduce((s,sp)=>s+(parseFloat(sp.pct)||0),0)-100)<0.01;});
  for(const item of S.invoice.items){
    const sps=S.rowSplits[item.artNr]||[];
    const tot=sps.reduce((s,sp)=>s+(parseFloat(sp.pct)||0),0);
    const ok=Math.abs(tot-100)<0.01&&sps.length>0;
    const el=document.getElementById(`pt-${item.artNr}`);
    if(el){el.textContent=tot.toFixed(0)+"%";el.style.color=ok?"var(--success)":"var(--danger)";}
    sps.forEach((sp,idx)=>{
      const a=document.getElementById(`sa-${item.artNr}-${idx}`);
      if(a){const{n,b}=splitAmount(sp,item);a.innerHTML=`${eur(b)}<br><span style="font-size:11px;color:var(--text3)">${eur(n)} netto</span>`;}
    });
    const row=document.getElementById(`row-${item.artNr}`);
    if(row){const sv=getSaved(S.savedSplits,item.artNr,S.invoice.addr);const isNew=!sv,isOld=sv?.expired;row.style.borderColor=isNew||isOld?"var(--warning)":ok?"var(--success)":"var(--danger)";}
  }
  const tb=document.getElementById("pos-tbody");
  if(tb) tb.innerHTML=pos.map(p=>`<tr><td>${p.ksId} – ${p.ksName}</td><td style="text-align:right;color:var(--text2)">${p.tax}%</td><td style="text-align:right;font-weight:500;color:${p.neg?"var(--danger)":"var(--text)"}">${eur(p.netto)}</td><td style="text-align:right;font-weight:500;color:${p.neg?"var(--danger)":"var(--text)"}">${eur(p.amount)}</td></tr>`).join("");
  const tt=document.getElementById("pos-total");
  if(tt){tt.textContent=eur(posTotal);tt.style.color=balanced?"var(--success)":"var(--danger)";}
  const df=document.getElementById("pos-diff");
  if(df) df.innerHTML=!balanced?`Rechnungsbetrag: ${eur(brutto)} · Differenz: ${eur(Math.abs(posTotal-brutto))}`:"";
  const cb=document.getElementById("btn-confirm");
  if(cb){cb.disabled=!allOk||!balanced;cb.textContent=allOk&&balanced?"Speichern & in Candis übertragen →":!allOk?"Aufteilung unvollständig":"Differenz: "+eur(Math.abs(posTotal-brutto));}
  const wb=document.getElementById("warn-diff");
  if(wb) wb.style.display=balanced?"none":"block";
}

  const icons={
    "file-invoice":`<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>`,

    "bookmark":`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
    "copy":`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
    "check":`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>`,
    "upload":`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
    "edit":`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    "save":`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>`,
    "key":`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>`,
  };
  return icons[name]||"";
}

function render(){
  document.getElementById("app").innerHTML=
    S.step==="upload"?renderUpload():S.step==="review"?renderReview():renderResult();
  attach();
}

// ── Upload screen ─────────────────────────────────────────────────────────────
function renderUpload(){
  const cfg = loadGistConfig();
  const hasToken = !!cfg.token;
  const hasGist = !!cfg.gistId;
  const tokenStatus = hasToken
    ? `<span class="badge badge-success">${icon("check")} Token gespeichert${hasGist?" · Gist vorhanden":""}</span>`
    : `<span class="badge badge-warning">Kein Token – bitte unten eintragen</span>`;

  return `
<div style="background:var(--bg);border-radius:var(--radius-lg);padding:2rem;margin-top:1rem">
  <h2 style="margin-bottom:6px">Terra Rechnungs-Splitter</h2>
  <p style="margin-bottom:6px">PDF hochladen · Kostenstellen prüfen · In Candis übertragen</p>
  <p style="font-size:12px;color:var(--text3);margin-bottom:24px">${icon("save")} Zuordnungen werden beim Bestätigen gespeichert – separat pro Lieferadresse.</p>
  <label id="dz" style="display:block;border:0.5px dashed var(--border2);border-radius:var(--radius-lg);padding:2.5rem 1.5rem;text-align:center;cursor:pointer;background:var(--bg2)">
    <div style="color:var(--text3);margin-bottom:10px">${icon("file-invoice")}</div>
    <span style="font-size:14px;color:var(--text2)">Terra-Rechnung als PDF hierher ziehen oder klicken</span>
    <input type="file" accept=".pdf" id="fi" style="display:none;border:none">
  </label>
  ${S.loading?'<p style="margin-top:12px;color:var(--text2)">Rechnung wird analysiert…</p>':''}
  ${S.error?`<p style="margin-top:12px;color:var(--danger)">${S.error}</p>`:''}

  <div class="card" style="margin-top:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <p style="font-weight:500;font-size:13px">${icon("key")} GitHub Token</p>
      ${tokenStatus}
    </div>
    ${!hasToken ? `
    <p style="font-size:12px;color:var(--text2);margin-bottom:10px">
      Für automatische Candis-Updates: <a href="https://github.com/settings/tokens/new?scopes=gist&description=Terra+Splitter" target="_blank" style="color:var(--info)">Token erstellen</a> (nur „gist"-Scope nötig), dann hier einfügen.
    </p>
    <div style="display:flex;gap:8px">
      <input type="password" id="token-input" placeholder="ghp_..." style="flex:1">
      <button id="btn-save-token">Speichern</button>
    </div>
    ${S.error?`<p style="margin-top:6px;font-size:12px;color:var(--danger)">${S.error}</p>`:''}
    ` : `
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">Das Bookmarklet liest die Positionen direkt aus dem Gist – immer aktuell.</p>
    <button id="btn-clear-token" style="font-size:12px;padding:4px 10px;color:var(--danger);border-color:var(--danger)">Token entfernen</button>
    `}
  </div>
</div>`; }

// ── Review screen ─────────────────────────────────────────────────────────────
function renderReview(){
  const{invoice,rowSplits,savedSplits}=S;
  const avail=getAvail(invoice.addr);
  const pos=calcPos(),posTotal=pos.reduce((s,p)=>s+p.amount,0);
  const brutto=Object.values(invoice.taxBrutto).reduce((s,v)=>s+v,0);
  const balanced=Math.abs(posTotal-brutto)<0.05;
  const allOk=invoice.items.every(it=>{const sps=rowSplits[it.artNr]||[];return sps.length>0&&Math.abs(sps.reduce((s,sp)=>s+(parseFloat(sp.pct)||0),0)-100)<0.01;});
  const addrLabel=invoice.addr==="euref"?"Euref-Campus":invoice.addr==="hermannstr"?"Hermannstr.":"unbekannt";

  const rows=invoice.items.map(item=>{
    const sps=rowSplits[item.artNr]||[];
    const tot=sps.reduce((s,sp)=>s+(parseFloat(sp.pct)||0),0);
    const ok=Math.abs(tot-100)<0.01&&sps.length>0;
    const sv=getSaved(savedSplits,item.artNr,invoice.addr);
    const isNew=!sv,isOld=sv?.expired,isFb=sv?.fromFallback&&!isOld;
    const bc=isNew||isOld?"var(--warning)":ok?"var(--success)":"var(--danger)";
    const badge=isNew?`<span class="badge badge-warning">neu</span>`:isOld?`<span class="badge badge-warning">veraltet</span>`:isFb?`<span class="badge badge-info">andere Adresse</span>`:`<span class="badge badge-success">bekannt</span>`;
    const spRows=sps.map((sp,i)=>{
      const{n,b}=splitAmount(sp,item);
      return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
  <select data-art="${item.artNr}" data-i="${i}" data-f="ks" style="flex:2;height:32px">
    ${avail.map(c=>`<option value="${c.id}"${c.id===sp.ks?" selected":""}>${c.id} – ${c.name}</option>`).join("")}
  </select>
  <input type="number" min="0" max="100" step="1" value="${sp.pct}" data-art="${item.artNr}" data-i="${i}" data-f="pct" style="width:58px;text-align:right">
  <span style="font-size:13px;color:var(--text2)">%</span>
  <span id="sa-${item.artNr}-${i}" style="font-size:13px;min-width:62px;text-align:right;color:var(--text2)">${eur(b)}<br><span style="font-size:11px;color:var(--text3)">${eur(n)} netto</span></span>
  ${sps.length>1?`<button data-rm="${item.artNr}" data-ri="${i}" style="padding:0 8px;height:32px">${icon("x")}</button>`:""}
</div>`; }).join("");
    return `<div id="row-${item.artNr}" style="border:0.5px solid ${bc};border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:6px;background:var(--bg)">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:500;color:var(--text)">${item.name}</div>
      <div style="font-size:12px;color:var(--text2)">Art. ${item.artNr} · ${eur(item.price)} brutto · ${item.tax}% MwSt.</div>
    </div>
    <div style="margin-left:8px">${badge}</div>
  </div>
  ${spRows}
  <div style="display:flex;justify-content:space-between;margin-top:4px">
    <button data-add="${item.artNr}" style="font-size:12px;padding:2px 8px">${icon("plus")} Split</button>
    <span id="pt-${item.artNr}" style="font-size:12px;color:${ok?"var(--success)":"var(--danger)"}">${tot.toFixed(0)}%</span>
  </div>
</div>`; }).join("");

  const pfandLine=[invoice.taxBrutto.P7?`7%: ${eur(invoice.taxBrutto.P7)}`:"",invoice.taxBrutto.P19?`19%: ${eur(invoice.taxBrutto.P19)}`:""].filter(Boolean).join(" · ");
  const nettoTotal=pos.reduce((s,p)=>s+p.netto,0);
  const posRows=pos.map(p=>`<tr><td>${p.ksId} – ${p.ksName}</td><td style="text-align:right;color:var(--text2)">${p.tax}%</td><td style="text-align:right;font-weight:500;color:${p.neg?"var(--danger)":"var(--text)"}">${eur(p.netto)}</td><td style="text-align:right;font-weight:500;color:${p.neg?"var(--danger)":"var(--text)"}">${eur(p.amount)}</td></tr>`).join("");

  const confirmLabel = S.gistSaving ? "Wird gespeichert…"
    : allOk&&balanced ? "Speichern & in Candis übertragen →"
    : !allOk ? "Aufteilung unvollständig"
    : "Differenz: "+eur(Math.abs(posTotal-brutto));

  return `
<div id="warn-diff" style="display:${balanced?"none":"block"};background:var(--danger-bg);border:0.5px solid var(--danger);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--danger)">⚠ Differenz: Rechnung wurde nicht richtig erkannt.</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
  <div>
    <h2>Kostenstellen prüfen</h2>
    <p style="font-size:12px;margin:2px 0 0">${invoice.items.length} Artikel · ${addrLabel}</p>
  </div>
  <button id="btn-back">${icon("arrow-left")} Zurück</button>
</div>
<div style="font-size:12px;color:var(--text2);margin-bottom:12px;padding:6px 10px;background:var(--bg2);border-radius:var(--radius)">
  <span class="badge badge-success">bekannt</span> = für ${addrLabel} gespeichert ·
  <span class="badge badge-info">andere Adresse</span> = bitte prüfen ·
  <span class="badge badge-warning">neu</span> = unbekannt
</div>
${rows}
<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:13px;margin-bottom:12px">
  <span style="font-weight:500">Pfand (auto → KS 1009):</span>
  <span style="margin-left:8px;color:var(--text2)">${pfandLine||"—"}</span>
</div>
<div class="card" style="margin-bottom:12px">
  <p style="font-weight:500;margin-bottom:8px;font-size:13px">Candis-Positionen</p>
  <table>
    <thead><tr><th style="text-align:left">Kostenstelle</th><th style="text-align:right">MwSt</th><th style="text-align:right">Netto</th><th style="text-align:right">Brutto</th></tr></thead>
    <tbody id="pos-tbody">${posRows}</tbody>
    <tfoot>
      <tr style="border-top:0.5px solid var(--border)">
        <td colspan="2" style="padding-top:6px;font-size:12px;color:var(--text2)">Gesamt</td>
        <td style="text-align:right;font-weight:500;padding-top:6px;color:var(--text2)">${eur(nettoTotal)}</td>
        <td id="pos-total" style="text-align:right;font-weight:500;padding-top:6px;color:${balanced?"var(--success)":"var(--danger)"}">${eur(posTotal)}</td>
      </tr>
      <tr><td colspan="4" id="pos-diff" style="font-size:12px;color:var(--danger);padding-top:2px">${!balanced?`Rechnungsbetrag: ${eur(brutto)} · Differenz: ${eur(Math.abs(posTotal-brutto))}`:"&nbsp;"}</td></tr>
    </tfoot>
  </table>
</div>
${S.gistError?`<p style="font-size:12px;color:var(--danger);margin-bottom:8px">⚠ Gist-Fehler: ${S.gistError}</p>`:''}
<p style="font-size:12px;color:var(--text3);margin-bottom:8px">${icon("save")} Zuordnungen werden beim Bestätigen für ${addrLabel} gespeichert.</p>
<button id="btn-confirm" class="btn-primary" ${!allOk||!balanced||S.gistSaving?"disabled":""}>
  ${confirmLabel}
</button>`; }

// ── Result screen ─────────────────────────────────────────────────────────────
function renderResult(){
  const pos=calcPos();
  const addrLabel=S.invoice.addr==="euref"?"Euref-Campus":S.invoice.addr==="hermannstr"?"Hermannstr.":"unbekannt";
  const cfg=loadGistConfig();
  const rows=pos.map((p,i)=>`
<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 12px;margin-bottom:2px;background:${i%2===0?"var(--bg2)":"var(--bg)"};border-radius:var(--radius);font-size:13px">
  <span style="font-weight:500">${p.ksId} – ${p.ksName}</span>
  <span style="color:var(--text2)">${p.tax}% MwSt.</span>
  <span style="font-weight:500;color:${p.neg?"var(--danger)":"var(--text)"}">${eur(p.netto)}${p.neg?" ⚠":""}</span>
</div>`).join("");

  const bmSection = S.bookmarklet ? `
<div class="card" style="background:var(--bg2);margin-bottom:14px">
  <p style="font-weight:500;margin-bottom:4px;font-size:13px">${icon("bookmark")} Bookmarklet</p>
  <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Diesen Link in die Lesezeichenleiste ziehen.</p>
  <div style="display:flex;gap:8px">
    <a href="${S.bookmarklet}" draggable="true" id="bm-link"
      style="flex:1;padding:8px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:13px;font-weight:500;text-decoration:none;color:var(--text);background:var(--bg);text-align:center;cursor:grab">
      ${icon("bookmark")} Candis Copy
    </a>
    <button id="btn-copy" style="padding:8px 14px">
      ${S.copied?icon("check"):icon("copy")} ${S.copied?"Kopiert":"Kopieren"}
    </button>
  </div>
</div>` : `
<div class="card" style="background:var(--bg2);margin-bottom:14px">
  <p style="font-size:13px;color:var(--text2)">${icon("check")} Gist aktualisiert – Bookmarklet zeigt beim nächsten Klick die neuen Werte.</p>
</div>`;

  return `
<h2 style="margin-bottom:4px">Bereit für Candis</h2>
<p style="margin-bottom:4px">Positionen gespeichert für ${addrLabel}.</p>
<p style="font-size:12px;color:var(--text2);margin-bottom:14px">Öffne in Candis den „Beleg aufteilen"-Dialog → Bookmarklet klicken → Beträge kopieren.</p>
<div style="margin-bottom:16px">${rows}</div>
${bmSection}
<div style="display:flex;gap:8px">
  <button id="btn-new" style="flex:1">${icon("upload")} Neue Rechnung</button>
  <button id="btn-back2" style="flex:1">${icon("edit")} Zurück zur Prüfung</button>
</div>`; }

// ── Event binding ─────────────────────────────────────────────────────────────
function attach(){
  if(S.step==="upload"){
    const fi=document.getElementById("fi"),dz=document.getElementById("dz");
    fi?.addEventListener("change",e=>handleFile(e.target.files[0]));
    dz?.addEventListener("dragover",e=>e.preventDefault());
    dz?.addEventListener("drop",e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);});
    document.getElementById("btn-save-token")?.addEventListener("click",()=>{
      const val=document.getElementById("token-input")?.value.trim();
      if(!val) return;
      saveGistConfig({token:val});
      render();
    });
    document.getElementById("btn-clear-token")?.addEventListener("click",()=>{
      saveGistConfig({});
      render();
    });
  }
  if(S.step==="review"){
    document.getElementById("btn-back")?.addEventListener("click",()=>set({step:"upload",invoice:null,error:null,gistError:null}));
    const saveData=()=>{
      const now=new Date().toISOString(),upd={...S.savedSplits},addr=S.invoice.addr;
      for(const item of S.invoice.items){
        if(!upd[item.artNr]) upd[item.artNr]={};
        upd[item.artNr][addr]={splits:S.rowSplits[item.artNr]||[],ts:now};
      }
      doSave(upd); return upd;
    };
    document.getElementById("btn-confirm")?.addEventListener("click",async ()=>{
      const upd=saveData();
      const pos=calcPos();
      const cfg=loadGistConfig();
      set({savedSplits:upd,gistSaving:true,gistError:null});
      try{
        const gistId=await gistWrite(pos);
        const rawUrl=makeRawUrl(gistId);
        // Bookmarklet immer neu anbieten – der Netto/Brutto-Code steckt im
        // Lesezeichen selbst, ein altes Bookmarklet muss daher ersetzt werden.
        set({savedSplits:upd,gistSaving:false,bookmarklet:makeBM(rawUrl),step:"result"});
      } catch(e){
        set({gistSaving:false,gistError:e.message});
      }
    });
    document.querySelectorAll("button[data-add]").forEach(b=>b.addEventListener("click",()=>{
      const art=b.dataset.add,avail=getAvail(S.invoice.addr);
      const sps=S.rowSplits[art]||[];
      const rem=Math.max(0,100-sps.reduce((s,sp)=>s+(parseFloat(sp.pct)||0),0));
      S={...S,rowSplits:{...S.rowSplits,[art]:[...sps,{ks:avail[0]?.id||"1001",pct:rem}]}};
      render();
    }));
    document.querySelectorAll("button[data-rm]").forEach(b=>b.addEventListener("click",()=>{
      const art=b.dataset.rm,idx=parseInt(b.dataset.ri);
      S={...S,rowSplits:{...S.rowSplits,[art]:(S.rowSplits[art]||[]).filter((_,i)=>i!==idx)}};
      render();
    }));
    document.querySelectorAll("select[data-art]").forEach(el=>el.addEventListener("change",()=>updateSplitField(el.dataset.art,parseInt(el.dataset.i),"ks",el.value)));
    document.querySelectorAll("input[data-art]").forEach(el=>el.addEventListener("input",()=>updateSplitField(el.dataset.art,parseInt(el.dataset.i),"pct",el.value)));
  }
  if(S.step==="result"){
    document.getElementById("btn-new")?.addEventListener("click",()=>set({step:"upload",invoice:null,bookmarklet:null,copied:false,gistError:null}));
    document.getElementById("btn-back2")?.addEventListener("click",()=>set({step:"review"}));
    document.getElementById("bm-link")?.addEventListener("click",e=>e.preventDefault());
    document.getElementById("btn-copy")?.addEventListener("click",()=>{
      navigator.clipboard.writeText(S.bookmarklet).then(()=>{set({copied:true});setTimeout(()=>set({copied:false}),2000);});
    });
  }
}

S.savedSplits=loadSaved();
render();
</script>
</body>
</html>
